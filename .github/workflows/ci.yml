name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify every plugin
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            name=$(basename "$dir")
            echo "::group::$name"
            node -e "JSON.parse(require('fs').readFileSync('$dir/package.json','utf8')); console.log('package.json ok')"
            for js in "$dir"*.js; do
              [ -e "$js" ] || continue
              node --check "$js"
              echo "syntax ok: $js"
            done
            for loc in "$dir"locale/*.json; do
              [ -e "$loc" ] || continue
              node -e "JSON.parse(require('fs').readFileSync('$loc','utf8')); console.log('$loc ok')"
            done
            if [ -f "$dir/test/selftest.mjs" ]; then
              node "$dir/test/selftest.mjs"
            fi
            echo "::endgroup::"
          done

      - name: Check documentation links
        run: node scripts/check-links.mjs
