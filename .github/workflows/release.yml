name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build portable archive
        shell: pwsh
        run: ./scripts/pack.ps1

      - name: Verify archive
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip | Format-Table Name, Length
          Get-FileHash dist/*.zip -Algorithm SHA256 | Format-List

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
