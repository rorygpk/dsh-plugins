name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build every plugin archive
        shell: pwsh
        run: ./scripts/pack-all.ps1

      - name: List archives
        shell: pwsh
        run: |
          Get-ChildItem plugins/*/dist/*.zip | Format-Table Name, Length
          Get-FileHash plugins/*/dist/*.zip -Algorithm SHA256 | Format-List

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: plugins/*/dist/*.zip
          generate_release_notes: true
